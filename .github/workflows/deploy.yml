name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 300s
          command_timeout: 40m
          script: |
            set -euo pipefail
            # Fix SSH permissions before any git operation
            chmod 700 ~/.ssh 2>/dev/null || true
            chmod 600 ~/.ssh/config 2>/dev/null || true
            chmod 600 ~/.ssh/id_* 2>/dev/null || true
            chmod 644 ~/.ssh/*.pub 2>/dev/null || true
            cd /var/www/rims
            # Fetch from the direct HTTPS URL of the target repository, falling back to origin main if needed
            git fetch https://github.com/caldimengg-manikandan/rims.git main || git fetch origin main
            git reset --hard FETCH_HEAD
            chmod +x deploy-zero-downtime.sh
            
            echo "=== VPS SYSTEM STATUS BEFORE DEPLOY ==="
            free -m
            df -h
            
            echo "=== LOGS OF CURRENT RUNNING CONTAINERS ==="
            docker compose -f docker-compose.prod.yml logs --tail=200 backend_blue backend_green || true
            docker compose -f docker-compose.prod.yml logs --tail=200 frontend_blue frontend_green || true
            
            if ! bash ./deploy-zero-downtime.sh; then
              echo "=== DEPLOYMENT FAILED: DIAGNOSTIC LOGS ==="
              echo "=== FREE MEMORY ==="
              free -m
              echo "=== DISK SPACE ==="
              df -h
              echo "=== DOCKER CONTAINERS ==="
              docker ps -a
              echo "=== DOCKER COMPOSE LOGS ==="
              docker compose -f docker-compose.prod.yml logs --tail=100
              exit 1
            fi
            
            echo "=== VPS CONTAINER LOGS AFTER SUCCESSFUL DEPLOY ==="
            ACTIVE_ENV=$(grep -oP '(?<=server frontend_)(blue|green)' nginx.conf 2>/dev/null | head -n 1 || true)
            docker compose -f docker-compose.prod.yml logs --tail=500 backend_${ACTIVE_ENV:-blue} | grep -A 5 -B 5 -i "puppeteer" || true
            docker compose -f docker-compose.prod.yml logs --tail=300 frontend_${ACTIVE_ENV:-blue} || true
            
            echo "=== VPS CONTAINER INTERNAL ROUTING & CHROMIUM TEST ==="
            RUNNING_BACKEND=$(docker compose -f docker-compose.prod.yml ps --services --filter "status=running" 2>/dev/null | grep -E '^backend_' | head -n 1 || true)
            RUNNING_FRONTEND=$(docker compose -f docker-compose.prod.yml ps --services --filter "status=running" 2>/dev/null | grep -E '^frontend_' | head -n 1 || true)
            docker compose -f docker-compose.prod.yml exec -T ${RUNNING_BACKEND:-backend_blue} curl -i -sL http://nginx/calrims/api/health/ || true
            docker compose -f docker-compose.prod.yml exec -T ${RUNNING_FRONTEND:-frontend_blue} /usr/bin/chromium --version --no-sandbox || true

