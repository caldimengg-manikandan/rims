services:
  nginx:
    image: nginx:alpine
    ports:
      - "9999:80"   # Host nginx proxies caldimproducts.com/calrims → localhost:9999
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    # NOTE: No depends_on health-gate here. nginx uses Docker's internal DNS resolver
    # (resolver 127.0.0.11 valid=10s) which handles upstream changes dynamically at runtime.
    # A blue-only health gate would block restarts during green deployments and vice versa.
    restart: always

  # --- REDIS (shared across all workers) ---
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- BLUE ENVIRONMENT ---
  frontend_blue:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=https://caldimproducts.com/calrims
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=https://caldimproducts.com/calrims
      - INTERNAL_API_URL=http://backend_blue:10000
      - API_INTERNAL_URL=http://backend_blue:10000
      - BRANDING_API_URL=http://backend_blue:10000
      - NEXT_PUBLIC_INTERNAL_API_URL=http://backend_blue:10000
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/calrims/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  backend_blue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - ENV=production
      - BACKEND_START_MODE=docker
      - FRONTEND_BASE_URL=https://caldimproducts.com/calrims
      - TRUSTED_PROXY_HOST=nginx
      - ENABLE_DEMO=false
      - REDIS_URL=redis://redis:6379/0
      # IMAP polling is handled by the dedicated worker service
      - IMAP_WORKER=false
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      # Startup migrations can take 30-60s on first run; give them time before
      # the health-check loop begins to avoid premature "unhealthy" signals.
      start_period: 60s
    restart: always

  # Dedicated IMAP/background worker (BLUE).
  # Runs the same backend image but with IMAP_WORKER=true.
  # Only one of worker_blue/worker_green should be active at a time during deployment.
  worker_blue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - ENV=production
      - BACKEND_START_MODE=docker
      - FRONTEND_BASE_URL=https://caldimproducts.com/calrims
      - TRUSTED_PROXY_HOST=nginx
      - ENABLE_DEMO=false
      - REDIS_URL=redis://redis:6379/0
      # This worker owns the IMAP polling loop
      - IMAP_WORKER=true
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: always

  # --- GREEN ENVIRONMENT ---
  frontend_green:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=https://caldimproducts.com/calrims
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=https://caldimproducts.com/calrims
      - INTERNAL_API_URL=http://backend_green:10000
      - API_INTERNAL_URL=http://backend_green:10000
      - BRANDING_API_URL=http://backend_green:10000
      - NEXT_PUBLIC_INTERNAL_API_URL=http://backend_green:10000
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/calrims/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  backend_green:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - ENV=production
      - BACKEND_START_MODE=docker
      - FRONTEND_BASE_URL=https://caldimproducts.com/calrims
      - TRUSTED_PROXY_HOST=nginx
      - ENABLE_DEMO=false
      - REDIS_URL=redis://redis:6379/0
      - IMAP_WORKER=false
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: always

  # Dedicated IMAP/background worker (GREEN).
  worker_green:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - ENV=production
      - BACKEND_START_MODE=docker
      - FRONTEND_BASE_URL=https://caldimproducts.com/calrims
      - TRUSTED_PROXY_HOST=nginx
      - ENABLE_DEMO=false
      - REDIS_URL=redis://redis:6379/0
      - IMAP_WORKER=true
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: always
